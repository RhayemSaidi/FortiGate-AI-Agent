version: "3.9"

services:
  fortigate-agent:
    build: .
    container_name: fortigate-agent
    ports:
      - "8501:8501"
    environment:
      - FORTIGATE_IP=${FORTIGATE_IP}
      - API_TOKEN=${API_TOKEN}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VERIFY_SSL=${VERIFY_SSL:-false}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      - chroma
    restart: unless-stopped
    networks:
      - fortigate-net

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    restart: unless-stopped
    networks:
      - fortigate-net

volumes:
  chroma_data:

networks:
  fortigate-net:
    driver: bridge
